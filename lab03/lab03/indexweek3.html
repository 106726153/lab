<h1><strong>CWA Help Desk Appointmant </strong></h1>
<p>The Help Desk is located in ATC620. Open 10:30cto 19:30 Monday to Friday</p>
<p>Check Blackboard for when CWA tutors will be there</p>
<form action="sumbit" method="https://www.swinburne.edu.au/">
    <fieldset>
        <legend>Student Details</legend>
        
        <label for="ID">Student ID</label>
    <input type="text" id="ID" ID="ID" required="required" pattern="\d(7,10)">
    <br>
    <label for="name">Given Name</label>
    <input type="text" name="name" id="name" pattern="[a-Za-Z]">
    <label for="name">Family Name</label>
    <input type="text" id="name" name="name"
    pattern="[a-Za-Z]">
    </fieldset>
</form>

<form action="sumbit" method="post">
    <fieldset>
        <legend>Your Unit</legend>

        <label for="10011">COS10011</label>
        <input type="radio" name="your unit" id="cos10011" value="cos10011" required="required">
        

        <label for="600004">COS60004</label>
        <input type="radio" name="your unit" id="cos60004" value="cos60004">
        

        <label for="60007">COS60007</label>
        <input type="radio" name="your unit" id="cos60007" value="cos60007">
        <br>
        <p><label for="tutor">Your Tutor</label>
        <select name="tutor" id="tutor">
            <option value="iron man">Tony Stark</option>
            <option value="diddy">P.Diddy</option>
            <option value="epstein">Jeffery Epstein</option>
            <option value="Hopium">Gordon Freeman</option>
            <option value="engineer">Issac Clarke</option>
        </select></p>
    </fieldset>
</form>
<form action="sumbit" method="post">
    <fieldset>
        <legend>Issue</legend>

        <label for="html">HTML</label>
        <input type="checkbox" id="hmtl" name="category[]" checked="checked">

        <label for="css">CSS</label>
        <input type="checkbox" id="css" name="category[]">

        <label for="javascript">JavaScript</label>
        <input type="checkbox" id="javascript" name="category[]">

        <label for="php">PHP</label>
        <input type="checkbox" id="php" name="category[]">

        <label for="mysql">MySQL</label>
        <input type="checkbox" id="mysql" name="category[]">
        <br>
        <label for="description">Description of Issue</label>
        <br>
        <textarea name="issue" id="issue" placeholder="Write description of your problem here..."></textarea>
    </fieldset>
</form>
<form action="sumbit" method="post">
    <fieldset>
        <legend>Preferred Date/Time</legend>

        <label for="date">Date</label>
        <input type="text" name="date" id="date" placeholder="dd/mm/yy">
        <br>
        <label for="time">Time</label>
        <input type="text" name="time" id="time" placeholder="00:00">
    </fieldset>
</form>

<input type="submit" value="Book">
<input type="reset" value="Reset Form">

</body>
